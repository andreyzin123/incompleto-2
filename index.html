<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de Chat Simples</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="chat-header">
        <img class="perfil" src="perfil-de-usuario.png" alt="">
        <img class="search" src="big-search-len.png" alt="">
      <h2>Chat</h2>
    </div>
    <div class="lista">

      <div class="chat-item">
        <img class="pessoinha" src="chat_avatar.png" alt="avatar">
        <div class="chat-details">
          <p class="chat-name">Stacy SR</p>
          <p class="chat-status">Recebido - 18h</p>
        </div>
      </div>

      <div class="chat-item">
        <img class="pessoinha" src="chat_avatar.png" alt="avatar">
        <div class="chat-details">
          <p class="chat-name">Ruhi</p>
          <p class="chat-status">Diga Olá</p>
        </div>
      </div>

      <div class="chat-item">
        <img class="pessoinha" src="chat_avatar.png" alt="avatar">
        <div class="chat-details">
          <p class="chat-name">Anandu</p>
          <p class="chat-status">Novo Snap - 1d</p>
        </div>
      </div>

      <div class="chat-item">
        <img class="pessoinha" src="chat_avatar.png" alt="avatar">
        <div class="chat-details">
          <p class="chat-name">Simran FC</p>
          <p class="chat-status">Recebido - 3d</p>
        </div>
      </div>

      <div class="chat-item">
        <img class="pessoinha" src="chat_avatar.png" alt="avatar">
        <div class="chat-details">
          <p class="chat-name">Team Snapchat</p>
          <p class="chat-status">Novo Snap - 1w</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
